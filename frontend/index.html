<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>餐點外送系統</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="appbar__brand">
        <span class="appbar__logo">🍱</span>
        <span>餐點外送系統</span>
      </div>
    </header>

    <main class="container">
      <div class="section-head">
        <h2>選擇你的角色</h2>
      </div>
      <div class="grid">
        <a
          class="rcard"
          href="./consumer.html"
          style="text-decoration: none; color: inherit; display: block"
        >
          <div class="rcard__name">🙋 消費者</div>
          <div class="rcard__desc">瀏覽餐廳、加入購物車、下單並追蹤訂單狀態</div>
          <div class="rcard__meta">進入消費者頁面 →</div>
        </a>
        <a
          class="rcard"
          href="./restaurant.html"
          style="text-decoration: none; color: inherit; display: block"
        >
          <div class="rcard__name">🏪 餐廳</div>
          <div class="rcard__desc">管理菜單、接單與更新訂單狀態</div>
          <div class="rcard__meta">進入餐廳工作台 →</div>
        </a>
        <a
          class="rcard"
          href="./courier.html"
          style="text-decoration: none; color: inherit; display: block"
        >
          <div class="rcard__name">🛵 外送員</div>
          <div class="rcard__desc">搶單、回報即時位置、完成配送</div>
          <div class="rcard__meta">進入外送員工作台 →</div>
        </a>
        <a
          class="rcard"
          href="./admin.html"
          style="text-decoration: none; color: inherit; display: block"
        >
          <div class="rcard__name">🛡️ 管理員</div>
          <div class="rcard__desc">管理餐廳帳號、跨餐廳分類與營運資料</div>
          <div class="rcard__meta">進入管理員工作台 →</div>
        </a>
      </div>
    </main>
  </body>
</html>
